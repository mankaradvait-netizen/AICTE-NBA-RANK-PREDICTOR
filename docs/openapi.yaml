openapi: 3.1.0
info:
  title: NIRF Deterministic Analysis & Ranking Platform API
  description: >
    Enterprise-grade, defense-in-depth deterministic scoring, marginal-gain gap analysis,
    and Excel-driven formula engine API for NIRF (National Institutional Ranking Framework).
  version: 1.0.0
servers:
  - url: https://nirf.internal.gov.in/api/v1
    description: Production Internal TLS Gateway
  - url: http://localhost:8080/api/v1
    description: Local Docker Development Gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute JWT access token (HS256)
    hmacAuth:
      type: apiKey
      in: header
      name: X-HMAC-Signature
      description: Server-to-server HMAC-SHA256 request signature

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    MfaVerifyRequest:
      type: object
      required:
        - temp_token
        - code
      properties:
        temp_token:
          type: string
        code:
          type: string
          pattern: '^[0-9]{6}$'

    SubmissionCreateRequest:
      type: object
      required:
        - category
        - academic_year
        - current_rank_band
        - target_rank_band
      properties:
        category:
          type: string
          example: ENGINEERING
        academic_year:
          type: string
          example: 2026-2027
        current_rank_band:
          type: string
          enum: [UNRANKED, RANK_101_300, TOP_100]
        target_rank_band:
          type: string
          enum: [TOP_300, TOP_100, TOP_50]
        raw_metrics:
          type: object
          additionalProperties:
            type: number

    SubmissionUpdateRequest:
      type: object
      required:
        - row_version
        - raw_metrics
      properties:
        row_version:
          type: integer
        raw_metrics:
          type: object
          additionalProperties:
            type: number

paths:
  /health:
    get:
      summary: Liveness health check
      responses:
        '200':
          description: Service healthy

  /auth/login:
    post:
      summary: User authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful or MFA prompt returned
        '401':
          description: Invalid credentials
        '423':
          description: Account locked due to repeated failures

  /auth/mfa/verify:
    post:
      summary: Verify 6-digit TOTP code and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verified, access token issued and refresh token cookie set

  /auth/refresh:
    post:
      summary: Rotate refresh token cookie and issue new access token
      responses:
        '200':
          description: New access token and rotated cookie issued

  /auth/logout:
    post:
      summary: Invalidate refresh token session
      responses:
        '200':
          description: Session terminated

  /inputs/schema:
    get:
      summary: Retrieve active input definitions and validation rules for dynamic forms
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            default: ENGINEERING
        - name: year
          in: query
          required: false
          schema:
            type: string
            default: 2026-2027
      responses:
        '200':
          description: Active schema definitions

  /submissions:
    get:
      summary: List institution submissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paged list of submissions
    post:
      summary: Create new draft submission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '201':
          description: Draft created

  /submissions/{id}:
    put:
      summary: Update draft submission metrics with optimistic locking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionUpdateRequest'
      responses:
        '200':
          description: Draft updated
        '409':
          description: Concurrency conflict (row_version mismatch)

  /submissions/{id}/submit:
    post:
      summary: Finalize, validate, score, and compute gap analysis
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission finalized and official score generated
        '422':
          description: Metric validation failure

  /submissions/{id}/results:
    get:
      summary: Retrieve official scorecard and gap recommendations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scorecard results

  /submissions/{id}/export.xlsx:
    get:
      summary: Download formatted Excel scorecard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Excel spreadsheet download

  /admin/formulas:
    get:
      summary: List formula sets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of formula sets

  /admin/formulas/upload:
    post:
      summary: Upload new NIRF master Excel workbook (5 MB limit)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Workbook imported and in VALIDATED status
        '422':
          description: Structural or formula lint errors detected

  /admin/benchmarks/ingest:
    post:
      summary: Ingest a 100-row benchmark cohort into a validated formula set
      description: Requires exactly 100 complete rows and an HTTPS source reference. The reference must be independently verified by reviewers before formula activation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - formula_set_id
                - cohort_data
                - source_reference
              properties:
                formula_set_id:
                  type: integer
                  minimum: 1
                cohort_data:
                  type: array
                  minItems: 100
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties:
                      type: number
                source_reference:
                  type: string
                  format: uri
                  pattern: '^https://'
      responses:
        '200':
          description: Cohort values ingested; source still requires independent verification
        '400':
          description: Invalid formula set, cohort size, or missing source reference
        '422':
          description: Invalid source URL, cohort metric values, or formula set state

  /admin/formulas/{id}/approve:
    post:
      summary: Four-eyes approval and activation of formula set
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Formula set activated
