[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
allow_url_fopen = Off
allow_url_include = Off
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 5M
max_execution_time = 30
max_input_time = 30

# Hardening: disable dangerous process execution and filesystem traversal functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,dl

# Restrict file access to application webroot, storage directory, and system temp
open_basedir = /var/www/html:/var/nirf/storage:/tmp

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
